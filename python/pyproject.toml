[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombokblocklist"
version = "0.1.0"
description = "Universal domain-name rule matcher: exact, subtree and wildcard rules, allow-over-block precedence, and parsers for hosts, domain-list and adblock-style lists. Part of the Lombok Ecosystem."
license = "Apache-2.0 OR MIT"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/lombokblocklist"]
